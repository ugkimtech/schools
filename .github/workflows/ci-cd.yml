name: Schools System CI/CD pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # checkout repo
      - uses: actions/checkout@v4

      # setup node (react build)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # build react front end
      - name: Build react frontend
        working-directory: ./frontend
        run: |
          ls
          npm install
          npm run build

      - name: Setup django
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # install django dependecies
      - name: Install django dependencies
        working-directory: ./backend
        run: |
          ls
          pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

      # login to docker hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build backend docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/schools-backend ./backend
      
      # push backend image
      - name: Push backend image
        run: docker push ${{secrets.DOCKER_USERNAME}}/schools-backend:latest

      # build front end image
      - name: Build front end docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/schools-frontend ./frontend

      # push frontend image
      - name: Push frontend image
        run: docker push ${{secrets.DOCKER_USERNAME}}/schools-frontend:latest